      tags: [release-upgrade, cleanup]
    # ======================
    # Télémétrie – Supprimer ubuntu-report, apport, popularity-contest
    # ======================
    - name: "Vérifier ce que ubuntu-report enverrait (avant suppression)"
      ansible.builtin.command: ubuntu-report show
      register: ubuntu_report_show
      failed_when: false
      changed_when: false
      tags: [telemetry, privacy]
    - name: "Afficher le contenu de ubuntu-report"
      ansible.builtin.debug:
        msg: "{{ ubuntu_report_show.stdout | default('ubuntu-report absent ou aucune donnée') }}"
      tags: [telemetry, privacy]
    - name: "Arrêter et désactiver apport"
      become: true
      ansible.builtin.systemd:
        name: apport.service
        state: stopped
        enabled: false
      failed_when: false
      tags: [telemetry, privacy]
    - name: "Purger la télémétrie et les rapports de plantage"
      become: true
      ansible.builtin.apt:
        name:
          - ubuntu-report
          - apport
          - popularity-contest
        state: absent
        purge: true
      tags: [telemetry, privacy]
    # ======================
    # Balises reseau residuelles vers Canonical / vendeurs de depots tiers
    # ATTENTION VIE PRIVEE : ces timers declenchent spontanement des requetes vers
    # motd.ubuntu.com, api.snapcraft.io, archive.ubuntu.com, security.ubuntu.com,
    # brave-browser-apt-release.s3.brave.com, repository.mullvad.net, download.docker.com,
    # fwupd.org. Chaque contact est correlable a la MAC aleatoire du moment et signe la
    # distribution + la liste des depots. Les mises a jour restent possibles a la demande
    # via l'alias `update` (defini plus bas dans .zshrc), sous controle de l'operateur.
    # ======================
    - name: "Neutraliser motd-news et snap repair"
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - motd-news.timer
        - motd-news.service
        - snapd.snap-repair.timer
      failed_when: false
      tags: [telemetry, privacy]
    - name: "Desactiver motd-news dans /etc/default/motd-news"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/default/motd-news
        regexp: '^\s*ENABLED\s*='
        line: 'ENABLED=0'
        create: false
      failed_when: false
      tags: [telemetry, privacy]
    - name: "Masquer les rafraichissements APT et firmware automatiques"
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - apt-daily.service
        - apt-daily-upgrade.service
        - fwupd-refresh.timer
        - fwupd-refresh.service
      failed_when: false
      tags: [telemetry, privacy]
    - name: "Figer les snaps installes (pas de refresh automatique)"
      become: true
      ansible.builtin.command: snap refresh --hold
      register: snap_hold
      changed_when: "'held' in (snap_hold.stdout | default('')) or 'Held' in (snap_hold.stdout | default(''))"
      failed_when: false
      tags: [telemetry, privacy]
    # ======================
    # Hostname – Neutraliser l'identifiant racine
    # ======================
    # Le hostname est le SEUL identifiant du poste qui ne change jamais et qui est
    # structurellement destine a sortir sur le reseau (option 12 DHCP, FQDN 81,
    # reverse-DNS, mDNS/LLMNR, User-Agent de certaines applis). Un nom "DESKTOP-XXXX"
    # style Windows est statistiquement unique. On le remplace par "ubuntu", nom
    # generique livre par le liveCD -> se fond dans la masse. Il suffit d'UNE fuite
    # pour lier definitivement entre elles toutes les MAC aleatoires.
    - name: "Neutraliser le hostname statique (identifiant racine)"
      become: true
      ansible.builtin.hostname:
        name: ubuntu
        use: systemd
      register: hostname_result
      notify: reboot_system
      tags: [privacy, hostname]
    - name: "Aligner /etc/hosts sur le nouveau hostname"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: '127.0.1.1 ubuntu'
        backup: true
      tags: [privacy, hostname]
    # Chromium/Brave stocke un SingletonLock symlink -> "HOSTNAME-PID". Apres
    # changement de hostname, le lock pointe vers l'ancien nom -> Brave/Chrome
    # affichent "The profile appears to be in use by another Brave process on
    # another computer" et refusent de demarrer. On supprime les 3 symlinks
    # Singleton* (ils sont recrees automatiquement au prochain lancement).
    - name: "Nettoyer les Singleton locks des navigateurs Chromium (hostname change)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ user_home }}/.config/BraveSoftware/Brave-Browser/SingletonLock"
        - "{{ user_home }}/.config/BraveSoftware/Brave-Browser/SingletonCookie"
        - "{{ user_home }}/.config/BraveSoftware/Brave-Browser/SingletonSocket"
        - "{{ user_home }}/.config/google-chrome/SingletonLock"
        - "{{ user_home }}/.config/google-chrome/SingletonCookie"
        - "{{ user_home }}/.config/google-chrome/SingletonSocket"
        - "{{ user_home }}/.config/chromium/SingletonLock"
        - "{{ user_home }}/.config/chromium/SingletonCookie"
        - "{{ user_home }}/.config/chromium/SingletonSocket"
      when: hostname_result is changed
      tags: [privacy, hostname, brave]
    # ======================
    # NetworkManager – Configuration privacy consolidee (source unique de verite)
    # ======================
    # Historique : le playbook posait 3 fichiers conf.d (00-disable-dhcp-hostname,
    # 10-disable-autoconnect, 99-random-mac) contenant des cles ("connection.autoconnect",
    # "ipv4/ipv6.dhcp-send-hostname") REFUSEES par la whitelist [connection] de
    # NetworkManager 1.46 (verifie : "unknown key" via --print-config). Resultat :
    # 4+ warnings au boot, fichiers sans effet, dependance a un durcissement
    # per-profil dont un bug (profil "lo" inclus par erreur, echecs masques) laissait
    # des profils non durcis. Un fichier manuel 02-stealth.conf (+ .bak) redoublait
    # le 99 avec des valeurs divergentes.
    # Nouvelle approche : UN SEUL fichier 99-anticorrelation.conf, avec UNIQUEMENT
    # des cles verifiees dans la whitelist des defauts globaux [connection] de NM
    # 1.46 (man 5 NetworkManager.conf). Les cles refusees sont laissees au
    # dispatcher (couvre les profils futurs) + au durcissement per-profil.
    - name: "Purger les conf.d NM concurrents (source unique = 99-anticorrelation)"
      become: true
      ansible.builtin.file:
        path: "/etc/NetworkManager/conf.d/{{ item }}"
        state: absent
      loop:
        - 00-disable-dhcp-hostname.conf
        - 01-disable-wifi-powersave.conf
        - 02-stealth.conf
        - 02-stealth.conf.bak
        - 10-disable-autoconnect.conf
        - 99-random-mac.conf
        - default-wifi-powersave-on.conf
        - wifi-powersave-off.conf
      notify: restart_networkmanager
      tags: [networkmanager, privacy]
    - name: "Ecrire la config privacy NetworkManager consolidee"
      become: true
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/99-anticorrelation.conf
        mode: "0644"
        # TOUTES les cles ci-dessous SONT dans la whitelist des defauts globaux
        # de NetworkManager 1.46 (man 5 NetworkManager.conf) -> zero warning au boot.
        # - addr-gen-mode=eui64 : avec cloned-mac-address=random, l'IID IPv6 suit
        #   la MAC aleatoire et change a chaque activation (verifie runtime).
        #   ATTENTION: "random" N'EST PAS une valeur valide sur NM 1.46 (repli
        #   silencieux en stable-privacy -> IID stable = re-correlation). Les
        #   valeurs autorisees sont: eui64 (0), stable-privacy (1), default (3),
        #   default-or-eui64 (2). Ne PAS remettre "random" ici.
        # - ip6-privacy=2 : epingle explicitement RFC4941 (adresses temporaires
        #   pour trafic sortant), au lieu de dependre du sysctl distro.
        # - hostname.from-dhcp/from-dns-lookup=false : empeche NM de reecrire le
        #   hostname transitoire depuis le DHCP ou le reverse-DNS.
        # - connection.llmnr/mdns=0 : force la desactivation LLMNR/mDNS au niveau
        #   NM (le par-lien prime sur le global systemd-resolved).
        # - dhcp-client-id=mac / dhcp-duid=ll : le client-id et le DUID suivent
        #   la MAC EN COURS D'USAGE (la clonee) et pas un identifiant persistant.
        # - autoconnect / dhcp-send-hostname : NON incluses ici (refusees en
        #   defaut global sur 1.46). Traitees par le dispatcher 50-privacy-newprofile
        #   et par le durcissement per-profil plus bas.
        content: |
          [device]
          wifi.scan-rand-mac-address=yes

          [connection]
          wifi.cloned-mac-address=random
          ethernet.cloned-mac-address=random
          wifi.powersave=2
          ipv4.dhcp-client-id=mac
          ipv6.dhcp-duid=ll
          ipv6.addr-gen-mode=eui64
          ipv6.ip6-privacy=2
          connection.llmnr=0
          connection.mdns=0
          hostname.from-dhcp=false
          hostname.from-dns-lookup=false
      notify: restart_networkmanager
      tags: [networkmanager, privacy, mac]
    # ======================
    # NetworkManager – Desactiver connectivity-check (GET HTTP en clair vers Canonical)
    # ======================
    # /usr/lib/NetworkManager/conf.d/20-connectivity-ubuntu.conf force NM a envoyer
    # une requete HTTP en clair vers connectivity-check.ubuntu.com a chaque attach
    # reseau -> signal "un poste Ubuntu vient de se connecter" horodate et
    # correlable a la MAC du moment. On le shadow avec un fichier de MEME NOM
    # dans /etc (documente dans man 5 NetworkManager.conf).
    - name: "Desactiver le connectivity check NetworkManager (shadow du fichier vendeur)"
      become: true
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/20-connectivity-ubuntu.conf
        mode: "0644"
        content: |
          [connectivity]
          enabled=false
          uri=
      notify: restart_networkmanager
      tags: [networkmanager, privacy]
    # ======================
    # NetworkManager – Dispatcher pre-up : couvre les profils FUTURS
    # ======================
    # Les cles connection.autoconnect et ipv4/ipv6.dhcp-send-hostname NE SONT PAS
    # acceptees comme defaut global sur NM 1.46 (unknown key). Elles doivent donc
    # etre posees PAR PROFIL. Ce dispatcher garantit que TOUT profil (existant ou
    # futur) qui monte est durci automatiquement, sans intervention manuelle.
    - name: "Poser le dispatcher NM (durcissement automatique des profils)"
      become: true
      ansible.builtin.copy:
        dest: /etc/NetworkManager/dispatcher.d/50-privacy-newprofile
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/sh
          # Durcit chaque profil NetworkManager au moment ou il monte :
          # - autoconnect no (jamais de reconnexion silencieuse a un reseau connu)
          # - dhcp-send-hostname no (pas d'option 12 / FQDN 81 en DHCP)
          # - hidden no sur les profils WiFi (pas de Probe Request dirigee = pas
          #   de diffusion de SSID)
          # Le dispatcher recoit: $1=interface, $2=action, $CONNECTION_UUID=profil.
          [ "$2" = "up" ] || exit 0
          [ -n "$CONNECTION_UUID" ] || exit 0
          # Determiner le type de connexion (WiFi/Ethernet/autre) pour n'appliquer
          # 802-11-wireless.hidden que sur les profils WiFi (sinon la commande echoue).
          conn_type=$(nmcli -t -f connection.type connection show "$CONNECTION_UUID" 2>/dev/null | cut -d: -f2)
          nmcli connection modify "$CONNECTION_UUID" \
            connection.autoconnect no \
            ipv4.dhcp-send-hostname no \
            ipv6.dhcp-send-hostname no >/dev/null 2>&1 || true
          if [ "$conn_type" = "802-11-wireless" ]; then
            nmcli connection modify "$CONNECTION_UUID" 802-11-wireless.hidden no >/dev/null 2>&1 || true
          fi
          exit 0
      tags: [networkmanager, privacy]
    # ======================
    # NetworkManager – WiFi power save (application immediate)
    # ======================
    # La persistance passe par 99-anticorrelation.conf (wifi.powersave=2).
    # Ici on applique juste immediatement, sans creer un fichier concurrent.
    - name: "Appliquer immédiatement power_save off sur toutes les cartes WiFi"
      become: true
      ansible.builtin.shell: |
        for dev in /sys/class/net/*; do
          iface=$(basename "$dev")
          # Une interface WiFi expose le répertoire phy80211
          if [ -e "$dev/phy80211" ]; then
            iw dev "$iface" set power_save off 2>/dev/null || true
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      tags: [networkmanager, wifi]
    # ======================
    # NetworkManager – Durcissement per-profil (WiFi + Ethernet uniquement)
    # ======================
    # Un LISTAGE UNIQUE, filtre sur les vrais types de device : exclut loopback
    # (side-effect: applique autoconnect=no sur "lo" empechait le profil loopback
    # de s'activer au boot) et les eventuels profils VPN/bridge/etc.
    # `set -o pipefail` garantit qu'une erreur nmcli en tete de pipeline se
    # propage. `changed_when: false` sur le listing (pure lecture), `changed_when: rc==0`
    # sur les modifs (le CHANGEMENT est masque par --terse sinon), assert final
    # pour verifier que rien n'est reste `yes`.
    - name: "Lister les profils WiFi/Ethernet (filtre par type)"
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        nmcli -t -f UUID,TYPE connection show \
          | awk -F: '$2=="802-11-wireless" || $2=="802-3-ethernet" {print $1}'
      args:
        executable: /bin/bash
      register: nm_uuids
      changed_when: false
      tags: [networkmanager, privacy]
    - name: "Durcir les profils existants (autoconnect + dhcp-send-hostname)"
      become: true
      ansible.builtin.command: >
        nmcli connection modify {{ item }}
        connection.autoconnect no
        ipv4.dhcp-send-hostname no
        ipv6.dhcp-send-hostname no
      loop: "{{ nm_uuids.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: nm_mod
      changed_when: nm_mod.rc == 0
      tags: [networkmanager, privacy]
    - name: "Lister les profils WiFi seuls (pour hidden=no)"
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        nmcli -t -f UUID,TYPE connection show \
          | awk -F: '$2=="802-11-wireless" {print $1}'
      args:
        executable: /bin/bash
      register: nm_wifi_uuids
      changed_when: false
      tags: [networkmanager, privacy]
    - name: "Interdire les probe requests dirigees (hidden=no sur profils WiFi)"
      become: true
      ansible.builtin.command: "nmcli connection modify {{ item }} 802-11-wireless.hidden no"
      loop: "{{ nm_wifi_uuids.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: nm_hidden
      changed_when: nm_hidden.rc == 0
      tags: [networkmanager, privacy]
    - name: "Verifier l'anti-correlation effective (audit bloquant)"
      become: true
      ansible.builtin.command: >
        nmcli -g ipv4.dhcp-send-hostname,ipv6.dhcp-send-hostname,connection.autoconnect
        connection show {{ item }}
      loop: "{{ nm_uuids.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: nm_audit
      changed_when: false
      tags: [networkmanager, privacy]
    - name: "Asserter qu'aucun profil ne fuite (hostname / autoconnect)"
      ansible.builtin.assert:
        that:
          - "'yes' not in (item.stdout_lines | map('lower') | list)"
          - "'true' not in (item.stdout_lines | map('lower') | list)"
        fail_msg: "Profil {{ item.item }} non durci : {{ item.stdout_lines }}"
      loop: "{{ nm_audit.results }}"
      loop_control:
        label: "{{ item.item }}"
      tags: [networkmanager, privacy]
    # ======================
    # NetworkManager – Watchdog de reconnexion automatique
    # Relance la connexion ACTIVE (WiFi ou Ethernet) si elle tombe,
    # sans auto-rejoindre les réseaux connus (compatible vie privée).
    # ======================
    - name: "Créer le script de reconnexion automatique"
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/nm-reconnect-watchdog.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Surveille TOUTES les connexions NetworkManager activees (WiFi + Ethernet)
          # et relance chacune si elle tombe. Ne reconnecte QUE ce que l'utilisateur a
          # activé (pas d'auto-join de réseaux connus au hasard) -> compatible vie privée.
          # L'état est en /run : rien n'est reconnecté après un reboot tant que
          # l'utilisateur n'a pas établi une première connexion manuelle.
          # Support dual-homed : garde separement le WiFi et l'Ethernet, si le WiFi
          # tombe pendant que l'Ethernet reste up, le WiFi est bien relance (le bug
          # historique `head -n1` ne prenait qu'un seul UUID).
          STATE=/run/nm-known-connections
          INTERVAL=10

          while true; do
            active=$(nmcli -t -f UUID,TYPE connection show --active 2>/dev/null \
              | awk -F: '$2=="802-11-wireless" || $2=="802-3-ethernet" {print $1}')

            # Memoriser TOUS les UUID actifs (un par ligne). Si aucun n'est actif, on garde
            # le fichier tel quel pour pouvoir relancer les derniers connus.
            if [ -n "$active" ]; then
              printf '%s\n' "$active" > "$STATE"
            fi

            # Pour chaque UUID connu, s'il n'est PAS dans la liste active, on le relance.
            if [ -f "$STATE" ]; then
              while read -r u; do
                [ -n "$u" ] || continue
                if ! printf '%s\n' "$active" | grep -qx "$u"; then
                  nmcli --wait 20 connection up uuid "$u" >/dev/null 2>&1 || true
                fi
              done < "$STATE"
            fi
            sleep "$INTERVAL"
          done
      tags: [networkmanager, reconnect]
    - name: "Créer le service systemd du watchdog de reconnexion"
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/nm-reconnect-watchdog.service
        mode: "0644"
        content: |
          [Unit]
          Description=Reconnexion automatique de la derniere connexion NetworkManager active
          After=NetworkManager.service
          Wants=NetworkManager.service

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/nm-reconnect-watchdog.sh
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      tags: [networkmanager, reconnect]
    - name: "Activer et démarrer le watchdog de reconnexion"
      become: true
      ansible.builtin.systemd:
        name: nm-reconnect-watchdog.service
        enabled: true
        state: started
        daemon_reload: true
      tags: [networkmanager, reconnect]
    # ======================
    # Ethernet – Désactiver EEE / power save via udev + ethtool
    # ======================
    - name: "Créer règle udev pour désactiver EEE et power save sur Ethernet"
      become: true
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/70-disable-ethernet-powersave.rules
        content: |
          # Désactiver EEE (Energy Efficient Ethernet) et power save sur toutes les interfaces filaires
          ACTION=="add", SUBSYSTEM=="net", KERNEL=="en*|eth*", RUN+="/bin/sh -c '/usr/sbin/ethtool --set-eee %k eee off || true'"
          ACTION=="add", SUBSYSTEM=="net", KERNEL=="en*|eth*", RUN+="/bin/sh -c '/usr/sbin/ethtool -s %k wol d || true'"
        mode: "0644"
      tags: [ethernet, network]
    - name: "Recharger les règles udev"
      become: true
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      tags: [ethernet, network]
    - name: "Appliquer immédiatement aux interfaces Ethernet déjà présentes"
      become: true
      ansible.builtin.shell: |
        for dev in /sys/class/net/en* /sys/class/net/eth*; do
          [ -e "$dev" ] || continue
          iface=$(basename "$dev")
          /usr/sbin/ethtool --set-eee "$iface" eee off 2>/dev/null || true
          /usr/sbin/ethtool -s "$iface" wol d 2>/dev/null || true
        done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      tags: [ethernet, network]
    # ======================
    # Activer IP forwarding (IPv4 + IPv6) + durcir les redirects
    # ======================
    # Le forwarding est actif en permanence (usage pentest : bettercap, relais SOCKS).
    # Un hote qui forwarde ET emet/accepte des ICMP redirects est TRES distinctif :
    # il ressort immediatement d'un scan/traceroute -> signal "machine d'attaque".
    # On desactive donc emission ET acceptation des redirects (v4+v6) pour minimiser
    # cette signature comportementale sans casser le routage.
    - name: "Activer IP forwarding + neutraliser les ICMP redirects (persistant)"
      become: true
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - { name: net.ipv4.ip_forward, value: "1" }
        - { name: net.ipv6.conf.all.forwarding, value: "1" }
        - { name: net.ipv4.conf.all.send_redirects, value: "0" }
        - { name: net.ipv4.conf.default.send_redirects, value: "0" }
        - { name: net.ipv4.conf.all.accept_redirects, value: "0" }
        - { name: net.ipv4.conf.default.accept_redirects, value: "0" }
        - { name: net.ipv6.conf.all.accept_redirects, value: "0" }
        - { name: net.ipv6.conf.default.accept_redirects, value: "0" }
      loop_control:
        label: "{{ item.name }}={{ item.value }}"
      tags: [network, forwarding]
    # ======================
    # Proxychains – Changer port SOCKS par défaut
    # ======================
    - name: "Changer le port SOCKS de proxychains de 9050 à 1080"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/proxychains4.conf
        regexp: '^socks[45]\s+127\.0\.0\.1\s+9050'
        line: 'socks5 127.0.0.1 1080'
        backup: true
      tags: [proxychains, network]
    # ======================
    # Désactiver avahi-daemon
    # ======================
    - name: "Désactiver et masquer avahi-daemon"
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - avahi-daemon.service
        - avahi-daemon.socket
      failed_when: false
      tags: [avahi, privacy]
    # ======================
    # systemd-resolved – Configuration DNS + epinglage LLMNR/mDNS
    # ======================
    # LLMNR (UDP 5355) et MulticastDNS (UDP 5353) diffusent le hostname sur le LAN
    # a chaque requete. Sur Ubuntu 24.04 le defaut COMPILE est deja "no" pour les
    # deux, mais rien ne l'epingle explicitement -> un update systemd ou un
    # drop-in inattendu suffirait a reactiver la diffusion. On les fixe donc en
    # dur avec community.general.ini_file (garantit la section [Resolve], ce que
    # lineinfile ne fait pas si la section n'existe pas encore).
    - name: "Epingler LLMNR / MulticastDNS / DNSStubListener a 'no'"
      become: true
      community.general.ini_file:
        path: /etc/systemd/resolved.conf
        section: Resolve
        option: "{{ item.k }}"
        value: "{{ item.v }}"
        mode: "0644"
        backup: true
        no_extra_spaces: true
      loop:
        - { k: LLMNR, v: 'no' }
        - { k: MulticastDNS, v: 'no' }
        - { k: DNSStubListener, v: 'no' }
      loop_control:
        label: "{{ item.k }}={{ item.v }}"
      notify: restart_systemd_resolved
      tags: [dns, systemd, privacy]
    - name: "Configurer resolv.conf comme lien symbolique"
      become: true
      ansible.builtin.file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      tags: [dns, systemd]
    # ======================
    # Docker
    # ======================
    - name: "Vérifier si Docker est installé"
      ansible.builtin.command: docker --version
      register: docker_check
      failed_when: false
      changed_when: false
      tags: [docker]
    - name: "Installer les prérequis Docker"
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present
      when: docker_check.rc != 0
      tags: [docker]
    - name: "Ajouter clé GPG Docker"
      become: true
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /usr/share/keyrings/docker-archive-keyring.asc
        mode: "0644"
      when: docker_check.rc != 0
      tags: [docker]
    - name: "Ajouter dépôt Docker"
      become: true
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/usr/share/keyrings/docker-archive-keyring.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable\n"
        mode: "0644"
      when: docker_check.rc != 0
      tags: [docker]
    - name: "Installer Docker Engine"
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: docker_check.rc != 0
      notify: reboot_system
      tags: [docker]
    - name: "Ajouter l'utilisateur au groupe docker"
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: true
      notify: reboot_system
      tags: [docker]
    # ======================
    # VirtualBox Guest Additions (uniquement si exécution dans une VM VirtualBox)
    # ======================
    - name: "Détecter si on est dans une VM VirtualBox"
      ansible.builtin.set_fact:
        is_virtualbox_vm: "{{ (ansible_virtualization_type | default('')) == 'virtualbox' or (ansible_system_vendor | default('')) == 'innotek GmbH' or 'VirtualBox' in (ansible_product_name | default('')) }}"
      tags: [virtualbox]
    - name: "Afficher la détection VirtualBox"
      ansible.builtin.debug:
        msg: "Environnement VirtualBox détecté : {{ is_virtualbox_vm }}"
      tags: [virtualbox]
    - name: "Installer les prérequis Guest Additions"
      become: true
      ansible.builtin.apt:
        name:
          - build-essential
          - dkms
          - linux-headers-{{ ansible_kernel }}
        state: present
      when: is_virtualbox_vm
      tags: [virtualbox]
    - name: "Installer VirtualBox Guest Additions"
      become: true
      ansible.builtin.apt:
        name:
          - virtualbox-guest-utils
          - virtualbox-guest-x11
        state: present
      when: is_virtualbox_vm
      notify: reboot_system
      tags: [virtualbox]
    - name: "Ajouter l'utilisateur au groupe vboxsf"
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: vboxsf
        append: true
      when: is_virtualbox_vm
      failed_when: false
      notify: reboot_system
      tags: [virtualbox]
    - name: "Configurer Docker pour désactiver le bridge docker0"
      become: true
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "bridge": "none",
            "iptables": false
          }
        mode: "0644"
      # Pas de notify: restart_docker. Le service docker.service est desactive plus
      # bas (start manuel a la demande), et le reboot final applique la nouvelle
      # daemon.json quand l'utilisateur demarrera docker.
      tags: [docker]
    - name: "Supprimer l'interface docker0 si elle existe"
      become: true
      ansible.builtin.command: ip link delete docker0
      register: docker0_delete
      failed_when: false
      changed_when: docker0_delete.rc == 0
      tags: [docker, cleanup]
    # ======================
    # Désactiver des services au démarrage (lancement manuel à la demande)
    # ======================
    - name: "Désactiver des services au démarrage"
      become: true
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
      loop:
        - bettercap.service
        - docker.service
        - containerd.service
        - NetworkManager-wait-online.service
      failed_when: false
      tags: [services, cleanup]
    # ======================
    # ZSH / Oh My Zsh
    # ======================
    - name: "Vérifier Oh My Zsh"
      ansible.builtin.stat:
        path: "{{ omz_dir }}"
      register: omz_stat
      tags: [zsh]
    - name: "Installer Oh My Zsh (verification integrite et rc reel)"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          tmp=/tmp/omz-install-$$.sh
          curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh -o "$tmp"
          # Un curl -f qui echoue laisse un fichier vide -> on refuse d'executer.
          if [ ! -s "$tmp" ]; then
            rm -f "$tmp"
            echo "Telechargement OMZ vide ou echec"
            exit 1
          fi
          RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh "$tmp" --unattended
          rc=$?
          rm -f "$tmp"
          exit $rc
      when: not omz_stat.stat.exists
      tags: [zsh]
    # chsh APRES OMZ : si l'install echoue, l'utilisateur ne se retrouve pas avec
    # zsh comme login shell et un .zshrc casse au prochain login.
    - name: "Définir zsh comme shell par défaut"
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh
      tags: [zsh]
    - name: "Forcer le thème gentoo"
      ansible.builtin.lineinfile:
        path: "{{ zshrc_path }}"
        regexp: '^ZSH_THEME='
        line: 'ZSH_THEME="gentoo"'
        create: true
      tags: [zsh]
    # ======================
    # Oh My Zsh – Plugins
    # ======================
    - name: "Installer plugins ZSH"
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ omz_dir }}/custom/plugins/{{ item.name }}"
        depth: 1
        update: true
      loop: "{{ zsh_plugins }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [zsh, plugins]
    - name: "Ajouter zsh-completions au fpath"
      ansible.builtin.blockinfile:
        path: "{{ zshrc_path }}"
        marker: "# {mark} ANSIBLE ZSH COMPLETIONS"
        insertbefore: '^source \$ZSH/oh-my-zsh\.sh'
        block: |
          fpath+=${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-completions/src
      tags: [zsh, plugins]
    - name: "Configurer plugins ZSH"
      ansible.builtin.lineinfile:
        path: "{{ zshrc_path }}"
        regexp: '^plugins='
        # zsh-syntax-highlighting DOIT etre charge en DERNIER (cf. son INSTALL.md :
        # "must be the last plugin sourced" pour envelopper tous les widgets ZLE
        # definis par les plugins precedents, notamment zsh-autosuggestions).
        line: 'plugins=(zsh-completions tmux fzf zsh-z zsh-nvm zsh-autosuggestions zsh-syntax-highlighting)'
        create: true
      tags: [zsh, plugins]
    # ======================
    # ZSH – Aliases utiles
    # ======================
    - name: "Ajouter aliases ZSH utiles"
      ansible.builtin.blockinfile:
        path: "{{ zshrc_path }}"
        marker: "# {mark} ANSIBLE ZSH ALIASES"
        block: |
          # Système
          alias ports='netstat -tulanp'
          alias meminfo='free -m -l -t'
          alias psmem='ps auxf | sort -nr -k 4 | head -10'
          alias pscpu='ps auxf | sort -nr -k 3 | head -10'
          # Réseau
          alias myip='curl ifconfig.me'
          alias speed='speedtest-cli'
          # Téléchargement
          alias wget='wget -c'
          # Disque
          alias df='df -H'
          alias du='du -ch'
          # APT
          alias update='sudo apt update && sudo apt full-upgrade -y'
          alias cleanup='sudo apt autoremove -y && sudo apt autoclean'
          # Navigation
          alias ll='ls -lah'
          alias la='ls -A'
          alias l='ls -CF'
          # Sécurité
          alias chmod-files='find . -type f -exec chmod 644 {} \;'
          alias chmod-dirs='find . -type d -exec chmod 755 {} \;'
      tags: [zsh, aliases]
    # ======================
    # SSH – Configuration
    # ======================
    - name: "Créer le dossier .ssh si nécessaire"
      ansible.builtin.file:
        path: "{{ user_home }}/.ssh"
        state: directory
        mode: "0700"
      tags: [ssh]
    - name: "Créer le fichier de configuration SSH"
      ansible.builtin.copy:
        dest: "{{ user_home }}/.ssh/config"
        mode: "0600"
        force: false
        content: |
          Host *
              ServerAliveInterval 30
              ServerAliveCountMax 3
              TCPKeepAlive yes
              ConnectTimeout 10
              ConnectionAttempts 3
      tags: [ssh]
    # ======================
    # Exegold (désactivable via -e install_exegold=false)
    # ======================
    - name: "Vérifier si Exegold est déjà cloné"
      ansible.builtin.stat:
        path: "{{ exegold_dir }}/.git"
      register: exegold_git_stat
      when: install_exegold
      tags: [exegold]
    - name: "Cloner Exegold (uniquement si absent)"
      # update:false + clone seulement si absent : on ne touche jamais a un depot
      # existant, meme s'il a des modifs locales. Pour MAJ : `git -C ~/Exegold pull`.
      ansible.builtin.git:
        repo: https://github.com/fsoc106/Exegold
        dest: "{{ exegold_dir }}"
        update: false
      when: install_exegold and not (exegold_git_stat.stat.exists | default(false))
      tags: [exegold]
    - name: "Créer venv pour Exegold"
      ansible.builtin.command: python3 -m venv {{ exegold_venv }}
      args:
        creates: "{{ exegold_venv }}"
      when: install_exegold
      tags: [exegold]
    - name: "Installer requirements Exegold dans venv"
      ansible.builtin.pip:
        requirements: "{{ exegold_dir }}/requirements.txt"
        virtualenv: "{{ exegold_venv }}"
      when: install_exegold
      tags: [exegold]
    - name: "Créer script wrapper exegol"
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/exegol
        mode: "0755"
        content: |
          #!/bin/bash
          {{ exegold_venv }}/bin/python {{ exegold_dir }}/exegol.py "$@"
      when: install_exegold
      tags: [exegold]
    # ======================
    # Claude Code
    # ======================
    - name: "Vérifier si Claude Code est installé"
      ansible.builtin.command: claude --version
      register: claude_code_check
      failed_when: false
      changed_when: false
      tags: [claude-code]
    - name: "Installer Claude Code (telechargement puis execution, rc reel)"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          tmp=/tmp/claude-install-$$.sh
          curl -fsSL https://claude.ai/install.sh -o "$tmp"
          if [ ! -s "$tmp" ]; then
            rm -f "$tmp"
            echo "Telechargement Claude Code vide ou echec"
            exit 1
          fi
          bash "$tmp"
          rc=$?
          rm -f "$tmp"
          exit $rc
      when: claude_code_check.rc != 0
      tags: [claude-code]
    # ======================
    # GNOME – Applications favorites dans le dock
    # ======================
    - name: "Configurer les applications favorites dans le dock"
      ansible.builtin.command: >
        gsettings set org.gnome.shell favorite-apps "{{ dock_favorites | string }}"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, dock]
    # ======================
    # Reboot
    # ======================
    # tags: [always] pour que la pause + le flush s'appliquent quel que soit
    # --tags (sinon `--tags system` notifie le reboot mais SAUTE la pause :
    # la machine redemarre sans confirmation au flush automatique de fin de play).
    # Skip de la pause si -e auto_confirm=true (utile en CI/cron).
    - name: "Confirmer avant d'appliquer les changements nécessitant un redémarrage"
      ansible.builtin.pause:
        prompt: "Appuyez sur Entrée pour appliquer les changements en attente (un reboot peut être déclenché), ou Ctrl+C puis 'A' pour annuler"
      when: not (auto_confirm | default(false) | bool)
      tags: [always, reboot]
    - name: "Appliquer les handlers en attente (déclenche le reboot si nécessaire)"
      ansible.builtin.meta: flush_handlers
      tags: [always, reboot]
    - name: "Message final"
      ansible.builtin.debug:
        msg: "Configuration terminée ! Si des changements l'exigeaient, le système redémarrera dans 1 minute. Ne pas oublier : apres reboot la machine n'a AUCUNE connexion active (autoconnect=off partout), il faut la lancer manuellement."
      tags: [always, reboot]
