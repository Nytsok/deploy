---
- name: "Ubuntu custom - GNOME + ZSH + X11 + Dark mode + Docker + Exegold + tmux"
  hosts: localhost
  become: false
  gather_facts: true
  vars:
    user_home: "{{ ansible_env.HOME }}"
    zshrc_path: "{{ user_home }}/.zshrc"
    omz_dir: "{{ user_home }}/.oh-my-zsh"
    exegold_dir: "{{ user_home }}/Exegold"
    exegold_venv: "{{ exegold_dir }}/venv"
    terminal_colors_file: "{{ user_home }}/terminal-colors.dconf"
    balena_etcher_version: "2.1.4"
    obsidian_version: "1.12.7"
    # Mettre à false pour déployer tout le playbook SAUF Exegold
    # (équivaut à : ansible-playbook playbook.yml -e install_exegold=false)
    install_exegold: true
    terminal_profile_id: "12cb3421-ab18-45fc-b08a-f5ad3b883a35"
    # Liste centralisée des raccourcis clavier personnalisés
    custom_keybinding_paths:
      - "/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/taskmanager/"
      - "/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/flameshot/"
    # Applications favorites du dock (définies une seule fois)
    dock_favorites:
      - org.gnome.Nautilus.desktop
      - org.gnome.Terminal.desktop
      - brave-browser.desktop
      - cherrytree.desktop
      - org.gnome.TextEditor.desktop
      - snap-store_snap-store.desktop
      - balena-etcher.desktop
      - rpi-imager_rpi-imager.desktop
    # gsettings groupés pour réduire la duplication
    gnome_power_settings:
      - { schema: "org.gnome.desktop.screensaver", key: "lock-enabled", value: "false" }
      - { schema: "org.gnome.desktop.screensaver", key: "ubuntu-lock-on-suspend", value: "false" }
      - { schema: "org.gnome.settings-daemon.plugins.power", key: "sleep-inactive-ac-type", value: "'nothing'" }
      - { schema: "org.gnome.settings-daemon.plugins.power", key: "sleep-inactive-battery-type", value: "'nothing'" }
      - { schema: "org.gnome.settings-daemon.plugins.power", key: "lid-close-ac-action", value: "'nothing'" }
      - { schema: "org.gnome.settings-daemon.plugins.power", key: "lid-close-battery-action", value: "'nothing'" }
      - { schema: "org.gnome.settings-daemon.plugins.power", key: "idle-dim", value: "false" }
      - { schema: "org.gnome.settings-daemon.plugins.power", key: "power-saver-profile-on-low-battery", value: "false" }
      - { schema: "org.gnome.desktop.session", key: "idle-delay", value: "0" }
    zsh_plugins:
      - { name: zsh-syntax-highlighting, repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
      - { name: zsh-completions, repo: "https://github.com/zsh-users/zsh-completions.git" }
      - { name: zsh-autosuggestions, repo: "https://github.com/zsh-users/zsh-autosuggestions.git" }
      - { name: zsh-z, repo: "https://github.com/agkozak/zsh-z.git" }
      - { name: zsh-nvm, repo: "https://github.com/lukechilds/zsh-nvm.git" }
  handlers:
    # ATTENTION : Ansible execute les handlers dans l'ordre de DEFINITION (pas de notification).
    # reboot_system est donc place EN DERNIER pour laisser update_grub, restart_networkmanager,
    # restart_systemd_resolved et restart_docker s'appliquer AVANT le reboot.
    - name: restart_networkmanager
      become: true
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted
    - name: restart_systemd_resolved
      become: true
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
    - name: restart_docker
      become: true
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: true
    - name: update_grub
      become: true
      ansible.builtin.command: update-grub
    - name: reboot_system
      become: true
      ansible.builtin.command: shutdown -r +1 "Redémarrage pour appliquer les changements (X11, Docker, etc.)"
      async: 1
      poll: 0
  tasks:
    # ======================
    # DBUS (pour gsettings) + détection environnement graphique
    # ======================
    - name: "Définir DBUS_SESSION_BUS_ADDRESS"
      ansible.builtin.set_fact:
        dbus_addr: "unix:path=/run/user/{{ ansible_user_uid }}/bus"
      tags: [always]
    - name: "Détecter la présence de GNOME (gsettings)"
      ansible.builtin.command: which gsettings
      register: gsettings_check
      failed_when: false
      changed_when: false
      tags: [always]
    - name: "Vérifier la joignabilité du bus D-Bus utilisateur"
      ansible.builtin.stat:
        path: "/run/user/{{ ansible_user_uid }}/bus"
      register: dbus_sock
      tags: [always]
    - name: "Définir has_gnome (binaire + bus D-Bus)"
      ansible.builtin.set_fact:
        has_gnome: "{{ gsettings_check.rc == 0 and dbus_sock.stat.exists }}"
      tags: [always]
    # ======================
    # GNOME – Désactiver verrouillage et veille automatique
    # ======================
    - name: "Configurer les paramètres d'alimentation GNOME"
      ansible.builtin.command: >
        gsettings set {{ item.schema }} {{ item.key }} {{ item.value }}
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      loop: "{{ gnome_power_settings }}"
      loop_control:
        label: "{{ item.schema }} {{ item.key }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, power]
    # ======================
    # Systemd – Configuration capot laptop
    # ======================
    - name: "Configurer systemd pour ignorer la fermeture du capot"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "^#?{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        backup: true
      loop:
        - { key: HandleLidSwitch, value: ignore }
        - { key: HandleLidSwitchDocked, value: ignore }
        - { key: HandleLidSwitchExternalPower, value: ignore }
      loop_control:
        label: "{{ item.key }}"
      notify: reboot_system
      tags: [system, power]
    # ======================
    # Forcer X11 (désactiver Wayland)
    # ======================
    - name: "Forcer X11 (WaylandEnable=false)"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/gdm3/custom.conf
        regexp: '^\s*#?\s*WaylandEnable='
        line: 'WaylandEnable=false'
        create: true
        backup: true
      notify: reboot_system
      tags: [system, x11]
    # ======================
    # GRUB – Afficher le menu avec timeout de 5s
    # ======================
    - name: "Configurer GRUB_TIMEOUT_STYLE=menu"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^\s*#?\s*GRUB_TIMEOUT_STYLE='
        line: 'GRUB_TIMEOUT_STYLE=menu'
        create: true
        backup: true
      notify: update_grub
      tags: [grub, system]
    - name: "Configurer GRUB_TIMEOUT=5"
      become: true
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^\s*#?\s*GRUB_TIMEOUT='
        line: 'GRUB_TIMEOUT=5'
        create: true
        backup: true
      notify: update_grub
      tags: [grub, system]
    # ======================
    # GNOME – Dark Mode
    # ======================
    - name: "Activer le dark mode GNOME"
      ansible.builtin.command: gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, appearance]
    - name: "Forcer thème GTK sombre"
      ansible.builtin.command: gsettings set org.gnome.desktop.interface gtk-theme 'Yaru-dark'
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, appearance]
    # ======================
    # GNOME – Désactiver les sons système
    # ======================
    - name: "Désactiver les sons système GNOME"
      ansible.builtin.command: "gsettings set {{ item.schema }} {{ item.key }} {{ item.value }}"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      loop:
        - { schema: "org.gnome.desktop.sound", key: "event-sounds", value: "false" }
        - { schema: "org.gnome.desktop.sound", key: "input-feedback-sounds", value: "false" }
        - { schema: "org.gnome.desktop.wm.preferences", key: "audible-bell", value: "false" }
      loop_control:
        label: "{{ item.schema }} {{ item.key }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, sound]
    # ======================
    # GNOME Keyring – Vider le trousseau (destructif : uniquement sur tag explicite)
    # ATTENTION : opération destructive et non idempotente. Elle EFFACE TOUS les secrets
    # enregistrés dans ~/.local/share/keyrings à chaque exécution. Volontairement placée
    # derrière le tag "never" : ne s'exécute QUE sur invocation explicite via
    #   ansible-playbook playbook.yml --tags keyring-wipe
    # ======================
    - name: "Lister les fichiers du keyring GNOME"
      ansible.builtin.find:
        paths: "{{ user_home }}/.local/share/keyrings"
        hidden: true
        file_type: any
      register: gnome_keyring_files
      tags: [never, keyring-wipe]
    - name: "Supprimer les fichiers du keyring GNOME"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ gnome_keyring_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      tags: [never, keyring-wipe]
    # ======================
    # GNOME Terminal – Couleurs personnalisées
    # ======================
    - name: "Créer un nouveau profil terminal perso"
      ansible.builtin.shell: |
        PROFILE_ID="{{ terminal_profile_id }}"
        PROFILE_PATH="/org/gnome/terminal/legacy/profiles:/:$PROFILE_ID"
        # Ajouter le profil à la liste s'il n'existe pas
        current_list=$(dconf read /org/gnome/terminal/legacy/profiles:/list)
        if [[ ! "$current_list" =~ "$PROFILE_ID" ]]; then
          if [ "$current_list" = "@as []" ] || [ -z "$current_list" ]; then
            dconf write /org/gnome/terminal/legacy/profiles:/list "['$PROFILE_ID']"
          else
            new_list=$(echo "$current_list" | sed "s/]$/, '$PROFILE_ID']/")
            dconf write /org/gnome/terminal/legacy/profiles:/list "$new_list"
          fi
        fi
        # Définir comme profil par défaut
        dconf write /org/gnome/terminal/legacy/profiles:/default "'$PROFILE_ID'"
        # Appliquer les couleurs
        dconf write $PROFILE_PATH/visible-name "'perso'"
        dconf write $PROFILE_PATH/use-theme-colors "false"
        dconf write $PROFILE_PATH/use-theme-transparency "false"
        dconf write $PROFILE_PATH/use-transparent-background "false"
        dconf write $PROFILE_PATH/scroll-on-output "false"
        dconf write $PROFILE_PATH/scrollback-unlimited "true"
        dconf write $PROFILE_PATH/background-color "'rgb(0,0,0)'"
        dconf write $PROFILE_PATH/foreground-color "'rgb(255,255,255)'"
        dconf write $PROFILE_PATH/palette "['rgb(0,0,0)', 'rgb(255,0,0)', 'rgb(0,205,0)', 'rgb(205,205,0)', 'rgb(0,182,205)', 'rgb(205,0,205)', 'rgb(0,205,205)', 'rgb(250,235,215)', 'rgb(64,64,64)', 'rgb(255,0,0)', 'rgb(0,255,0)', 'rgb(255,255,0)', 'rgb(0,177,255)', 'rgb(195,79,79)', 'rgb(0,255,255)', 'rgb(255,255,255)']"
      args:
        executable: /bin/bash
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, terminal]
    - name: "Vérifier si le fichier de couleurs existe"
      ansible.builtin.stat:
        path: "{{ terminal_colors_file }}"
      register: terminal_colors_stat
      when: has_gnome
      tags: [gnome, terminal]
    - name: "Importer les couleurs du terminal"
      ansible.builtin.shell: |
        dconf load /org/gnome/terminal/legacy/profiles:/ < {{ terminal_colors_file }}
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      when: has_gnome and terminal_colors_stat.stat.exists
      failed_when: false
      changed_when: false
      tags: [gnome, terminal]
    - name: "Afficher un message si le fichier de couleurs est absent"
      ansible.builtin.debug:
        msg: "Fichier {{ terminal_colors_file }} non trouvé. Couleurs par défaut conservées."
      when: has_gnome and not terminal_colors_stat.stat.exists
      tags: [gnome, terminal]
    # ======================
    # GNOME – Dock
    # ======================
    - name: "Mettre le dock en bas"
      ansible.builtin.command: gsettings set org.gnome.shell.extensions.dash-to-dock dock-position 'BOTTOM'
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, dock]
    - name: "Mettre Show Apps en haut du dock"
      ansible.builtin.command: gsettings set org.gnome.shell.extensions.dash-to-dock show-apps-at-top true
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, dock]
    # ======================
    # GNOME – Afficher fichiers cachés
    # ======================
    - name: "Afficher les fichiers cachés par défaut dans Nautilus"
      ansible.builtin.command: "gsettings set {{ item.schema }} {{ item.key }} true"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      loop:
        - { schema: "org.gtk.Settings.FileChooser", key: "show-hidden" }
        - { schema: "org.gnome.nautilus.preferences", key: "show-hidden-files" }
      loop_control:
        label: "{{ item.schema }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, files]
    # ======================
    # GNOME – Raccourcis clavier personnalisés
    # ======================
    - name: "Désactiver le raccourci de déconnexion par défaut"
      ansible.builtin.command: gsettings set org.gnome.settings-daemon.plugins.media-keys logout "[]"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, shortcuts]
    - name: "Désactiver tous les raccourcis screenshot GNOME"
      ansible.builtin.command: "gsettings set org.gnome.shell.keybindings {{ item }} '[]'"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      loop:
        - show-screenshot-ui
        - screenshot
        - screenshot-window
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, flameshot]
    - name: "Enregistrer la liste des raccourcis clavier personnalisés"
      ansible.builtin.command: >
        gsettings set org.gnome.settings-daemon.plugins.media-keys custom-keybindings
        "{{ custom_keybinding_paths | string }}"
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, shortcuts]
    - name: "Configurer raccourci Ctrl+Alt+Delete pour Moniteur système"
      ansible.builtin.command: >
        gsettings set org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/taskmanager/
        {{ item.key }} '{{ item.value }}'
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      loop:
        - { key: name, value: "Moniteur système" }
        - { key: command, value: "gnome-system-monitor" }
        - { key: binding, value: "<Control><Alt>Delete" }
      loop_control:
        label: "{{ item.key }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, shortcuts]
    - name: "Configurer Flameshot sur Print Screen"
      ansible.builtin.command: >
        gsettings set org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/flameshot/
        {{ item.key }} '{{ item.value }}'
      environment:
        DBUS_SESSION_BUS_ADDRESS: "{{ dbus_addr }}"
      loop:
        - { key: name, value: "Flameshot" }
        - { key: command, value: "flameshot gui" }
        - { key: binding, value: "Print" }
      loop_control:
        label: "{{ item.key }}"
      failed_when: false
      changed_when: false
      when: has_gnome
      tags: [gnome, flameshot]
    # ======================
    # APT – Upgrade + paquets
    # ======================
    - name: "Full upgrade système (inclut mise à jour du cache)"
      become: true
      ansible.builtin.apt:
        upgrade: full
        update_cache: true
      tags: [apt, upgrade]
    - name: "Installer paquets système"
      become: true
      ansible.builtin.apt:
        name:
          - tar
          - bzip2
          - ansible
          - libreoffice
          - libreoffice-l10n-fr
          - libreoffice-help-fr
          - hunspell-fr
          - hyphen-fr
          - mythes-fr
          - openfortivpn
          - obs-studio
          - python3-pip
          - python3-venv
          - curl
          - git
          - zsh
          - fzf
          - tmux
          - flameshot
          - cherrytree
          - rpi-imager
          - keepassxc
          - vlc
          - timeshift
          - p7zip-full
          - file-roller
          - deja-dup
          - net-tools
          - gnome-tweaks
          - gnome-shell-extensions
          - bettercap
          - proxychains4
          - pipx
          - htop
          - ethtool
          - cpufrequtils
          - iw
        state: present
      tags: [apt, packages]
    # ======================
    # CPU – Forcer le gouverneur performance
    # ======================
    - name: "Configurer le gouverneur CPU sur performance (persistant)"
      become: true
      ansible.builtin.copy:
        dest: /etc/default/cpufrequtils
        content: |
          GOVERNOR="performance"
        mode: "0644"
      tags: [cpu, performance]
    - name: "Activer le service cpufrequtils"
      become: true
      ansible.builtin.systemd:
        name: cpufrequtils
        enabled: true
      failed_when: false
      tags: [cpu, performance]
    - name: "Appliquer immédiatement le gouverneur performance"
      become: true
      ansible.builtin.shell: |
        # Chainer sur le SUCCES et non sur la presence : si cpupower est present mais
        # que le driver de scaling est absent (frequent en VM), on tente cpufreq-set.
        if command -v cpupower >/dev/null 2>&1 && cpupower frequency-set -g performance >/dev/null 2>&1; then
          :
        elif command -v cpufreq-set >/dev/null 2>&1; then
          for c in /sys/devices/system/cpu/cpu[0-9]*; do
            cpufreq-set -c "${c##*cpu}" -g performance 2>/dev/null || true
          done
        fi
      args:
        executable: /bin/bash
      failed_when: false
      changed_when: false
      tags: [cpu, performance]
    # ======================
    # LibreOffice – Forcer le français (interface + correcteur)
    # ======================
    - name: "S'assurer que le dossier config LibreOffice existe"
      ansible.builtin.file:
        path: "{{ user_home }}/.config/libreoffice/4/user"
        state: directory
        mode: "0755"
      tags: [libreoffice]
    - name: "Vérifier si une config LibreOffice existe déjà"
      ansible.builtin.stat:
        path: "{{ user_home }}/.config/libreoffice/4/user/registrymodifications.xcu"
      register: lo_config_stat
      tags: [libreoffice]
    - name: "Configurer LibreOffice en français (uniquement si pas de config existante)"
      ansible.builtin.copy:
        dest: "{{ user_home }}/.config/libreoffice/4/user/registrymodifications.xcu"
        mode: "0644"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <oor:items xmlns:oor="http://openoffice.org/2001/registry" xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <item oor:path="/org.openoffice.Office.Linguistic/General"><prop oor:name="DefaultLocale" oor:op="fuse"><value>fr-FR</value></prop></item>
            <item oor:path="/org.openoffice.Office.Linguistic/General"><prop oor:name="DefaultLocale_CJK" oor:op="fuse"><value></value></prop></item>
            <item oor:path="/org.openoffice.Office.Linguistic/General"><prop oor:name="DefaultLocale_CTL" oor:op="fuse"><value></value></prop></item>
            <item oor:path="/org.openoffice.Setup/L10N"><prop oor:name="ooLocale" oor:op="fuse"><value>fr</value></prop></item>
            <item oor:path="/org.openoffice.Setup/L10N"><prop oor:name="ooSetupSystemLocale" oor:op="fuse"><value>fr-FR</value></prop></item>
            <item oor:path="/org.openoffice.Office.Linguistic/ServiceManager/SpellCheckerList"><prop oor:name="org.openoffice.lingu.MySpellSpellChecker" oor:op="fuse"><value><it>fr-FR</it></value></prop></item>
            <item oor:path="/org.openoffice.Office.Linguistic/ServiceManager/HyphenatorList"><prop oor:name="org.openoffice.lingu.LibHnjHyphenator" oor:op="fuse"><value><it>fr-FR</it></value></prop></item>
            <item oor:path="/org.openoffice.Office.Linguistic/ServiceManager/ThesaurusList"><prop oor:name="org.openoffice.lingu.new.Thesaurus" oor:op="fuse"><value><it>fr-FR</it></value></prop></item>
          </oor:items>
      when: not lo_config_stat.stat.exists
      tags: [libreoffice]
    # ======================
    # Brave Browser (dépôt officiel Brave) + durcissement WebRTC
    # ======================
    - name: "Ajouter la clé de signature Brave"
      become: true
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: "0644"
      tags: [brave]
    - name: "Ajouter le dépôt Brave"
      become: true
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/brave-browser-release.list
        content: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }}] https://brave-browser-apt-release.s3.brave.com/ stable main\n"
        mode: "0644"
      tags: [brave]
    - name: "Installer Brave Browser (met à jour le cache APT)"
      become: true
      ansible.builtin.apt:
        name: brave-browser
        state: present
        update_cache: true
      tags: [brave]
    - name: "Créer le dossier de policies Brave"
      become: true
      ansible.builtin.file:
        path: /etc/brave/policies/managed
        state: directory
        mode: "0755"
      tags: [brave, hardening]
    - name: "Durcir WebRTC + désactiver la télémétrie Brave"
      become: true
      ansible.builtin.copy:
        dest: /etc/brave/policies/managed/webrtc-hardening.json
        mode: "0644"
        # WebRtcIPHandling (moderne) + WebRTCIPHandlingPolicy (historique, RTC en MAJ).
        # L'orthographe "WebRtcIPHandlingPolicy" n'existe pas cote Chromium et serait ignoree.
        # A verifier apres deploiement dans brave://policy (statut OK, pas Unknown policy).
        content: |
          {
            "WebRtcIPHandling": "disable_non_proxied_udp",
            "WebRTCIPHandlingPolicy": "disable_non_proxied_udp",
            "BraveP3AEnabled": false,
            "BraveStatsPingEnabled": false,
            "MetricsReportingEnabled": false
          }
      tags: [brave, hardening]
    # ======================
